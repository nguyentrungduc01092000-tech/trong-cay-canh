# Deploy len GitHub Pages khi push len main. Chi viet file, KHONG kich hoat o day.
# Truoc khi dung: Ruler tao repo + bat Pages (Settings > Pages > Build and
# deployment > Source: "GitHub Actions"), dien file CNAME o goc repo (ten mien
# cua repo nay: sunbow.click HOAC plasma.click — xem CAU-TRUC-REPO.md),
# dien `repo:` trong src/admin/config.yml thanh repo that.
# Khac ban goc trong site/.github/workflows/deploy-pages.yml o 4 cho:
#  (1) buoc "Copy CNAME" — Pages mat custom domain neu artifact thieu file
#      CNAME, ke ca deploy dinh ky (scheduled-build.yml cung co buoc nay);
#  (2) buoc "Pre-push gate" — chay pre-push-check-truyen.py SAU khi build,
#      TRUOC khi upload artifact; gate truot thi deploy DUNG, khong len live.
#  (3) buoc "Split sitemap/robots" (27/11/2026, Ruler 08:50) — moi domain chi
#      duoc co sitemap/robots cua chinh no (sunbow 30 loc, plasma 27 loc);
#      ban gop 57 loc + 2 dong Sitemap la loi voi Google. Chay SAU gate
#      (gate kiem ban theo domain), TRUOC upload artifact; domain lay tu CNAME.
#  (4) buoc "Set SITE_LANG from CNAME" (Phuong an A, Ruler 15:52 27/11) —
#      moi web chi build 1 ngon ngu (sunbow -> de, plasma -> pl); chay TRUOC
#      npm run build. Khong co buoc nay, build sinh ca 2 ngon ngu.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Phuong an A (Ruler 15:52 27/11): moi web chi build 1 ngon ngu.
      # Doc CNAME de biet domain nay (sunbow.click -> de, plasma.click -> pl)
      # roi dat SITE_LANG cho buoc build sau (GITHUB_ENV ap dung cho cac buoc
      # tiep theo trong job). Domain la thi loi ngay.
      - name: Set SITE_LANG from CNAME
        run: |
          test -f CNAME || { echo "THIEU file CNAME o goc repo — dung deploy"; exit 1; }
          DOMAIN=$(cat CNAME | tr -d '[:space:]')
          case "$DOMAIN" in
            sunbow.click) echo "SITE_LANG=de" >> $GITHUB_ENV ;;
            plasma.click) echo "SITE_LANG=pl" >> $GITHUB_ENV ;;
            *) echo "CNAME khong hop le: $DOMAIN (can sunbow.click|plasma.click)"; exit 1 ;;
          esac
          echo "SITE_LANG da dat theo CNAME=$DOMAIN"
      - run: npm run build
      - name: Copy CNAME into _site
        run: |
          test -f CNAME || { echo "THIEU file CNAME o goc repo — dung deploy"; exit 1; }
          cp CNAME _site/CNAME
          cat _site/CNAME
      # Quyet Ruler 07:24 ngay 27/11: go de-03/pl-03, day dung 20 DE / 19 PL.
      # --site-dir . : trong repo, goc site CHINH LA goc repo (src/ + _site/ o day);
      # khong truyen thi gate mac dinh tim <cha-cua-repo>/site (khong co trong CI)
      # va truot "khong co _site" (run 45921989405 ngay 27/11).
      # Phuong an A: gate lay --domain tu CNAME de kiem ban theo domain
      # (sunbow 20 DE / 0 PL, plasma 0 DE / 19 PL); so truyen mac dinh theo domain.
      - name: Pre-push gate (per-domain)
        run: |
          DOMAIN=$(cat CNAME | tr -d '[:space:]')
          python3 scripts/pre-push-check-truyen.py --no-build --site-dir . --domain "$DOMAIN"
      # Kiem chung sitemap/robots theo domain (Ruler 08:50 27/11, Phuong an A
      # 15:52 27/11): build da loc theo ngon ngu (SITE_LANG) nen sitemap/robots
      # sinh ra da theo domain; buoc nay chi kiem chung (va loc neu con sot
      # muc cua domain kia), roi moi upload artifact. Loi thi dung deploy.
      - name: Verify sitemap/robots per domain (CNAME)
        run: python3 scripts/split-sitemap-robots.py --site-dir .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
